name: release

# Tagging vX.Y.Z builds the desktop app on macOS, Windows and Linux and attaches
# the archives to a GitHub release. The version in build/config.yml and the
# platform metadata is stamped from the tag, so nothing needs editing by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v3.0.0
  TASK_VERSION: v3.54.0

jobs:
  darwin:
    # macos-15 is Apple silicon, so one runner can build arm64, amd64 and lipo
    # them into a universal bundle. macos-latest resolves to a newer image whose
    # arm64 pool had no capacity; pinning the label keeps the job acquirable.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: node build/stamp-version.mjs "$VERSION"
      - run: npm ci
        working-directory: frontend
      # Builds arm64 and amd64 and lipos them, so one runner covers both Macs.
      - run: task darwin:package:universal
      - name: Package
        run: |
          set -euo pipefail
          wails3 tool package --format dmg --name Hark --out bin \
            --background build/darwin/dmg-background.png \
            --volume-icon build/darwin/icons.icns \
            --file-icon build/darwin/dmg-file-icon.icns \
            --window-width 540 --window-height 380
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent bin/Hark.app "dist/hark_${VERSION}_darwin_universal.zip"
          mv bin/Hark.dmg "dist/hark_${VERSION}_darwin_universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Resolve version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: node build/stamp-version.mjs "$VERSION"
        shell: bash
      - run: npm ci
        working-directory: frontend
      - run: task windows:build
        shell: bash
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path bin/Hark.exe -DestinationPath "dist/hark_$($env:VERSION)_windows_amd64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    # The default Wails v3 Linux backend is GTK 4 + WebKitGTK 6.0, which needs
    # GTK >= 4.14 at build time: Ubuntu 22.04 is too old, 24.04 is the baseline.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install GTK/WebKit headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: node build/stamp-version.mjs "$VERSION"
      - run: npm ci
        working-directory: frontend
      - run: task linux:build
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C bin -czf "dist/hark_${VERSION}_linux_amd64.tar.gz" Hark
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [darwin, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      # Checkout first: it runs `git clean -ffdx`, which would delete the
      # artifacts if they were downloaded before it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # git log needs the history, and the previous tag to describe the range.
      - name: Release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "Hark ${VERSION}"
            echo
            if [ -n "$PREV" ]; then
              echo "## Changes since ${PREV}"
              echo
              git log --no-merges --pretty='- %s' "${PREV}..${GITHUB_REF_NAME}"
            else
              echo "## Changes"
              echo
              git log --no-merges --pretty='- %s' "${GITHUB_REF_NAME}"
            fi
            echo
            cat <<EOF
          ## Assets

          | Platform | File | Notes |
          | --- | --- | --- |
          | macOS 12+ | \`hark_${VERSION}_darwin_universal.dmg\` / \`.zip\` | Universal (Apple silicon + Intel). Ad-hoc signed, not notarised: first launch needs right-click → Open, or \`xattr -dr com.apple.quarantine /Applications/Hark.app\`. |
          | Windows 10+ | \`hark_${VERSION}_windows_amd64.zip\` | Needs the WebView2 runtime (preinstalled on Windows 11, bundled with Edge on 10). |
          | Linux x86-64 | \`hark_${VERSION}_linux_amd64.tar.gz\` | GTK 4 + WebKitGTK 6.0, i.e. Ubuntu 24.04 or newer: \`apt install libgtk-4-1 libwebkitgtk-6.0-4\`. |

          ## Install

          macOS, through the Homebrew tap:

          \`\`\`sh
          brew install --cask abcdlsj/tap/hark
          \`\`\`

          Otherwise download the archive for your platform above. The CLI is separate:
          \`go install github.com/abcdlsj/hark/cmd/hark@latest\`.

          ## First run

          The window opens the workspace from \`--workspace\`, \`\$HARK_WORKSPACE\`, the
          nearest ancestor with \`envs.yaml\`, or \`~/.hark\`.
          EOF
          } > NOTES.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "Hark ${GITHUB_REF_NAME#v}"
          --notes-file NOTES.md

      # The cask pins the universal dmg, so it can only be written once that file
      # exists: generate it from the release asset itself, not from a transcription.
      # Copy the attached hark.rb into abcdlsj/homebrew-tap's Casks/ afterwards.
      - name: Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="dist/hark_${VERSION}_darwin_universal.dmg"
          [ -f "$DMG" ] || { echo "::error::missing $DMG"; ls -R dist; exit 1; }
          SHA="$(sha256sum "$DMG" | cut -d' ' -f1)"
          cat > hark.rb <<EOF
          # typed: strict
          # frozen_string_literal: true

          cask "hark" do
            version "$VERSION"

            sha256 "$SHA"

            url "https://github.com/abcdlsj/hark/releases/download/v#{version}/hark_#{version}_darwin_universal.dmg"
            name "Hark"
            desc "Local-first API workbench for humans and agents"
            homepage "https://github.com/abcdlsj/hark"

            depends_on macos: :monterey

            app "Hark.app"

            zap trash: [
              "~/Library/Application Support/com.abcdlsj.hark",
              "~/Library/Caches/com.abcdlsj.hark",
              "~/Library/HTTPStorages/com.abcdlsj.hark",
              "~/Library/Preferences/com.abcdlsj.hark.plist",
              "~/Library/Saved Application State/com.abcdlsj.hark.savedState",
              "~/Library/WebKit/com.abcdlsj.hark",
            ]
          end
          EOF
          cat hark.rb
          command -v ruby >/dev/null && ruby -c hark.rb
          gh release upload "$GITHUB_REF_NAME" hark.rb --repo "$GITHUB_REPOSITORY" --clobber

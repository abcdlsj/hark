name: probe-macos

on: workflow_dispatch

jobs:
  macos-13:
    runs-on: macos-13
    continue-on-error: true
    steps:
      - run: uname -m
  macos-15-intel:
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - run: uname -m
  macos-15:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - run: uname -m
  macos-latest:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - run: uname -m
